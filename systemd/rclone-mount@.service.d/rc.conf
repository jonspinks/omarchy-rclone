# Optional: give each rclone mount a control socket.
#
# Without this the widget still shows mount health, storage quota, sign-in
# state and local disk space. What it CANNOT show is live transfer activity,
# VFS cache usage, upload queues and the current speed limit -- all of those
# come from rclone's rc API, which is off unless the mount is started with it.
#
# Installed along with the template (see the README):
#   cp -r systemd/. ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user restart rclone-mount@OneDrive   # per instance, when idle
#
# A restart briefly unmounts the drive, so do it when nothing is writing.
#
# WHY A UNIX SOCKET, NOT A PORT: the template runs one instance per remote and
# they are alive at the same time, so a fixed --rc-addr :5572 would leave the
# second instance failing to bind forever. %t is the user runtime directory
# (/run/user/UID), which is mode 0700 and owned by the user, and %i is the
# instance -- so each mount gets its own socket that no other account can read.
# That is also why --rc-no-auth is acceptable here: the socket's permissions
# are the authentication. Do NOT swap this for a TCP port without adding
# --rc-user/--rc-pass.
#
# ExecStart must be cleared before being re-set, because it is single-valued.
# That means this file repeats the whole command: if you ever edit the flags in
# rclone-mount@.service, edit them here too.

[Service]
ExecStartPre=-/usr/bin/rm -f %t/rclone-mount-%i.sock
ExecStart=
ExecStart=/usr/bin/rclone mount %i: %h/%i \
  --vfs-cache-mode full \
  --vfs-cache-max-size 5G \
  --vfs-cache-max-age 24h \
  --dir-cache-time 1h \
  --poll-interval 1m \
  --umask 077 \
  --log-level INFO \
  --rc \
  --rc-addr unix://%t/rclone-mount-%i.sock \
  --rc-no-auth
